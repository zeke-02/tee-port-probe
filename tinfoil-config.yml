# Throwaway probe for the Fount Mail container split and the non-AWS relay. Holds no
# secrets and stores no data. Two questions:
#
#   1. Does the enclave accept a tunnel to a port published by a container whose only
#      network is `closed`? `front` is on `frontlink` alone and publishes 2525.
#      Test: tinfoil forward netprobe -L 2525:2525, then nc localhost 2525.
#   2. Does `allowlist` egress reach non-AWS hosts on 443? `back` loops TLS
#      handshakes to an OVH and a Hetzner host (where the relay VM would live) and
#      reports them on /status.
cvm-version: 0.14.17
cpus: 2
memory: 4096

networks:
  frontlink: {}
  out:
    egress: allowlist
    allow:
      - www.ovhcloud.com
      - www.hetzner.com

containers:
  - name: "back"
    image: "docker.io/library/python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc"
    networks: [frontlink, out]
    ports: ["8080:8080"]
    entrypoint:
      - python
      - -u
      - -c
      - |
        import collections, json, socket, socketserver, ssl, threading, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        HOSTS = ["www.ovhcloud.com", "www.hetzner.com"]
        BOOTED = time.time()
        lock = threading.Lock()
        tls = ssl.create_default_context()
        egress = {h: {"ok": 0, "failed": 0, "max_s": 0.0} for h in HOSTS}
        control = {"reached": 0, "failed": 0}
        errors = collections.deque(maxlen=40)
        link = {"connections_from_front": 0}

        def handshake(host):
            start = time.time()
            with socket.create_connection((host, 443), timeout=10) as raw:
                with tls.wrap_socket(raw, server_hostname=host):
                    pass
            return round(time.time() - start, 2)

        def loop():
            while True:
                for h in HOSTS:
                    try:
                        took = handshake(h)
                        with lock:
                            egress[h]["ok"] += 1
                            egress[h]["max_s"] = max(egress[h]["max_s"], took)
                    except Exception as e:
                        with lock:
                            egress[h]["failed"] += 1
                            errors.append([round(time.time() - BOOTED), h, type(e).__name__, str(e)[:100]])
                # A host off the allowlist must fail, or the allowlist proves nothing.
                try:
                    handshake("www.debian.org")
                    with lock:
                        control["reached"] += 1
                except Exception:
                    with lock:
                        control["failed"] += 1
                time.sleep(5)

        class Link(socketserver.BaseRequestHandler):
            def handle(self):
                with lock:
                    link["connections_from_front"] += 1
                self.request.sendall(b"back ok\n")

        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                with lock:
                    body = json.dumps({"uptime_s": round(time.time() - BOOTED),
                                       "egress_443": egress,
                                       "off_allowlist_control": control,
                                       "link": link,
                                       "errors": list(errors)}, indent=1).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass

        threading.Thread(target=loop, daemon=True).start()
        threading.Thread(target=socketserver.ThreadingTCPServer(("0.0.0.0", 7000), Link).serve_forever, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()

  - name: "front"
    image: "docker.io/library/python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc"
    networks: [frontlink]
    ports: ["2525:2525"]
    entrypoint:
      - python
      - -u
      - -c
      - |
        import socket, socketserver

        def via_back():
            try:
                with socket.create_connection(("back", 7000), timeout=5) as s:
                    return s.recv(64).decode().strip()
            except Exception as e:
                return "unreachable: " + type(e).__name__

        def direct():
            try:
                socket.create_connection(("www.ovhcloud.com", 443), timeout=5).close()
                return "REACHED (closed network leaked)"
            except Exception as e:
                return "blocked: " + type(e).__name__

        class H(socketserver.BaseRequestHandler):
            def handle(self):
                self.request.sendall(("220 front ok; back=%s; direct_egress=%s\r\n" % (via_back(), direct())).encode())

        socketserver.ThreadingTCPServer(("0.0.0.0", 2525), H).serve_forever()

shim:
  upstream-port: 8080
  upstream-container: back
  paths:
    - /status
