# Throwaway probe for Fount Mail gap 1.10. Does S3 stay reachable through Tinfoil's
# hostname allowlist while its IPs rotate? Holds no secrets and stores no data. An
# unsigned request answers 403, which still proves the connection got through.
cvm-version: 0.14.17
cpus: 2
memory: 8192

networks:
  probe:
    egress: allowlist
    allow:
      - fount-mail-063207099341.s3.us-east-1.amazonaws.com
      - fount-mail-bootlog-063207099341.s3.us-east-1.amazonaws.com
      - fount-mail-routing-backup-063207099341.s3.us-east-1.amazonaws.com

containers:
  - name: "probe"
    image: "docker.io/library/python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc"
    networks: [probe]
    ports: ["8080:8080"]
    entrypoint:
      - python
      - -u
      - -c
      - |
        import collections, http.client, json, socket, threading, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        HOSTS = ["fount-mail-063207099341.s3.us-east-1.amazonaws.com",
                 "fount-mail-bootlog-063207099341.s3.us-east-1.amazonaws.com",
                 "fount-mail-routing-backup-063207099341.s3.us-east-1.amazonaws.com"]
        BOOTED = time.time()
        lock = threading.Lock()
        stats = {h: {"ok": 0, "failed": 0, "statuses": {}, "ips": collections.Counter(), "failed_ips": collections.Counter()} for h in HOSTS}
        errors = collections.deque(maxlen=40)

        def attempt(host):
            ip = None
            try:
                ip = socket.gethostbyname(host)
                c = http.client.HTTPSConnection(host, timeout=8)
                c.request("HEAD", "/")
                status = c.getresponse().status
                c.close()
                with lock:
                    s = stats[host]
                    s["ok"] += 1
                    s["ips"][ip] += 1
                    s["statuses"][str(status)] = s["statuses"].get(str(status), 0) + 1
            except Exception as e:
                with lock:
                    s = stats[host]
                    s["failed"] += 1
                    if ip:
                        s["failed_ips"][ip] += 1
                    errors.append([round(time.time() - BOOTED), host.split(".")[0], ip, type(e).__name__, str(e)[:100]])

        def loop():
            while True:
                for h in HOSTS:
                    attempt(h)
                time.sleep(2)

        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                with lock:
                    body = json.dumps({"uptime_s": round(time.time() - BOOTED), "hosts": {
                        h.split(".")[0]: {"ok": s["ok"], "failed": s["failed"], "statuses": s["statuses"],
                                          "distinct_ips": len(s["ips"]), "failed_ips": len(s["failed_ips"])}
                        for h, s in stats.items()}, "errors": list(errors)}, indent=1).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass

        threading.Thread(target=loop, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()

shim:
  upstream-port: 8080
  paths:
    - /status
