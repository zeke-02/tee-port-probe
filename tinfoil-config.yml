# Probe: can a non-admin container accept public inbound TCP on exactly port 25?
# Holds no secrets and stores nothing. Port 25 sends one banner line and closes.
cvm-version: 0.14.17
cpus: 2
memory: 8192

cvm-network:
  inbound-ports: [25]

networks:
  probe: {}

containers:
  - name: "probe"
    image: "docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8"
    networks: [probe]
    ports: ["25:25"]
    cap_add: [NET_BIND_SERVICE]
    entrypoint:
      - python
      - -u
      - -c
      - |
        import socket, threading
        from http.server import BaseHTTPRequestHandler, HTTPServer

        def smtp():
            server = socket.create_server(("0.0.0.0", 25))
            while True:
                conn, peer = server.accept()
                print("port 25 connection from", peer[0])
                conn.sendall(f"220 port25-probe peer={peer[0]}\r\n".encode())
                conn.close()

        class Health(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")

        threading.Thread(target=smtp, daemon=True).start()
        HTTPServer(("0.0.0.0", 8080), Health).serve_forever()

shim:
  upstream-port: 8080
  paths:
    - /health
